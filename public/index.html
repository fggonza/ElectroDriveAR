<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover es crucial para el "notch" en iPhones y Androids modernos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ElectroDriveAR</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Contenedor Principal -->
    <div id="app-container">
        
        <!-- ==========================================
             VISTA 1: SIMULADOR (Activa por defecto)
             ========================================== -->
        <main id="vista-simulador" class="view active">
            <div class="ev-card">
                <div class="ev-header">
                    <!-- Estos datos se pisarán dinámicamente con JS, pero dejamos un placeholder realista -->
                    <h2 id="ev-title">BYD Dolphin Mini GS</h2>
                    <span id="ev-badge" class="badge">43.2 kWh</span>
                </div>

                <!-- Slider SOC -->
                <div class="slider-container">
                    <div class="slider-labels">
                        <label for="soc-slider">Nivel de Carga (SOC)</label>
                        <span id="soc-display" class="accent-text">100%</span>
                    </div>
                    <input type="range" id="soc-slider" class="electric-slider" min="5" max="100" value="100">
                </div>

                <!-- Slider Antigüedad (Degradación) -->
                <div class="slider-container">
                    <div class="slider-labels">
                        <label for="years-slider">Antigüedad de Batería</label>
                        <span id="years-display" class="accent-text">0 años</span>
                    </div>
                    <input type="range" id="years-slider" class="electric-slider" min="0" max="15" value="0" step="1">
                </div>

                <!-- Display de Resultados -->
                <div class="result-container">
                    <div class="range-output" id="output-container">
                        <span id="range-value">380</span> <span class="unit">km</span>
                    </div>
                    <!-- Spinner de carga oculto por defecto -->
                    <div id="loader" class="electric-loader hidden"></div>
                </div>
            </div>
        </main>

        <!-- ==========================================
             VISTA 2: CONFIGURACIÓN DE VEHÍCULO
             ========================================== -->
        <main id="vista-configuracion" class="view">
            <div class="ev-card">
                <h2>Ajustes de Vehículo</h2>
                <p class="text-muted">Seleccioná tu modelo para ajustar los cálculos de autonomía.</p>
                
                <div class="input-group">
                    <select id="vehiculo-select" class="modern-select">
                        <option value="">Cargando catálogo...</option>
                    </select>
                </div>
                
                <div id="vehiculo-info" class="ev-specs">
                    <!-- Aquí se inyectan las specs (batería, autonomía WLTP) vía JS -->
                </div>
            </div>
        </main>

    </div>

    <!-- ==========================================
         BARRA DE NAVEGACIÓN INFERIOR (Estilo iOS/Android)
         ========================================== -->
    <nav class="bottom-nav">
        <!-- Usamos data-target para vincular el botón con el ID del main correspondiente -->
        <button class="nav-btn active" data-target="vista-simulador">
            ⚡ Simulador
        </button>
        <button class="nav-btn" data-target="vista-configuracion">
            🚗 Vehículo
        </button>
    </nav>

    <!-- Conexión de Lógica -->
    <script src="js/app.js"></script>
</body>
</html>
